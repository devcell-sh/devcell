# pre-commit hooks for devcell.
#
# Bootstrap paths (any one works):
#   - `nix develop`          — shellHook in flake.nix installs the hooks
#   - `mise install`         — .mise.toml pins pre-commit + runs install
#   - `pip install pre-commit && pre-commit install`
#
# Run manually across the tree:  `pre-commit run --all-files`
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Warn (non-blocking) when go.mod/go.sum change and vendorHash
      # may be stale. Run `task nix:sync` to fix before pushing.
      - id: nix-vendor-hash
        name: Check flake.nix vendorHash matches go.mod/go.sum
        entry: task nix:check-vendor-hash
        language: system
        files: ^(go\.mod|go\.sum)$
        pass_filenames: false
        require_serial: true
        verbose: true

      # Keep the published config schema (web/public/schema/v0.0.0/) in sync
      # with internal/cfg.CellConfig and the home catalog. Regenerates on
      # every commit that touches either; a changed output fails the commit
      # so you re-stage it (pre-commit's formatter convention). The drift
      # test in internal/cfg is the CI backstop.
      - id: schema-generate
        name: Regenerate web/public/schema/v0.0.0/devcell.json
        entry: task schema:generate
        language: system
        files: ^(internal/cfg/.*\.go|web/public/schema/v0\.0\.0/.*\.json)$
        pass_filenames: false
        require_serial: true
