version: 2

project_name: devcell

before:
  hooks:
    - go run github.com/swaggo/swag/cmd/swag@latest init -g cmd/serve.go -o api/swagger --parseDependency --parseInternal

builds:
  - id: devcell
    main: ./cmd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
        -X 'github.com/devcell-sh/devcell/internal/version.Version={{.Version}}'
        -X 'github.com/devcell-sh/devcell/internal/version.GitCommit={{.Env.SHORT_SHA}}'
        -X 'github.com/devcell-sh/devcell/internal/version.BuildDate={{.Date}}'

archives:
  - id: release_archive
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - LICENSE
      - README.md

release:
  github:
    owner: devcell-sh
    name: devcell
  draft: true
  replace_existing_draft: true
  make_latest: false

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^chore'
      - '^test'
      - '^docs'
      - 'Merge pull request'
      - 'Merge branch'

checksum:
  name_template: "{{ .ProjectName }}-checksums.txt"

homebrew_casks:
  - name: devcell-dev
    repository:
      owner: devcell-sh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    url:
      template: "https://github.com/devcell-sh/devcell/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: Dmitry Kireev
      email: dmitry@atd.sh
    homepage: "https://github.com/devcell-sh/devcell"
    description: "Run AI coding agents in a consistent Docker dev environment (dev build)"
    conflicts:
      - cask: devcell
    binaries: ["devcell"]

  - name: "devcell-dev@{{ .Version }}"
    repository:
      owner: devcell-sh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    url:
      template: "https://github.com/devcell-sh/devcell/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: Dmitry Kireev
      email: dmitry@atd.sh
    homepage: "https://github.com/devcell-sh/devcell"
    description: "Run AI coding agents in a consistent Docker dev environment (dev build)"
    conflicts:
      - cask: devcell
    binaries: ["devcell"]
