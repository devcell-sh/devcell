# .devcell.toml
# DevCell project configuration. Optional global defaults at ~/.config/devcell/devcell.toml

[cell]
# Nix packages from the stable channel: the default place for tools.
packages = ["pre-commit"]
# Override the default image tag.
# image_tag = "v0.0.0-go"
# Timezone (IANA format). If omitted, inherits host $TZ.
# timezone = "Europe/Prague"
# Extra volume mounts: /path, /host:/container, /host:/container:ro.
# volumes = ["~/work/secrets:/run/secrets:ro", "~/.ssh:/home/user/.ssh:ro"]

# Desktop GUI (Xvfb + VNC + browser). Injects DEVCELL_GUI_ENABLED=true.
[gui]
enabled = true

[llm]
# Where agents send requests: default, ollama, openrouter.
provider = "ollama"
model = "qwen3-coder-next:latest"

[llm.providers.ollama]
models = ["qwen3-coder-next:latest", "qwen3-coder-next:latest-128k", "qwen3-coder:30b", "qwen3-coder:30b-128k", "glm-4.7-flash:latest", "deepseek-r1:32b", "qwen2.5-coder:32b", "qwen3:8b", "qwen3:8b-128k", "qwen3:0.6b"]

# [git]
# Git identity forwarded into the container.
# If omitted and no GIT_AUTHOR_* env vars are set, ~/.config/git/config is mounted read-only instead.
# author_name = "Your Name"
# author_email = "you@example.com"

[env]
# Extra environment variables forwarded into the container.
# GITHUB_TOKEN = "ghp_xxx"

[mise]
# mise runtime settings forwarded as MISE_<UPPER_KEY> env vars.
# See: https://mise.jdx.dev/configuration.html
# trusted_config_paths = "/"

# [packages.node]
# npm tools not in nixpkgs, installed by mise at container start.

# [packages.python]
# PyPI tools not in nixpkgs, installed by mise at container start.
